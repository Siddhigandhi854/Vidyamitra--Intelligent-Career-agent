services:
  # Backend Service
  - type: web
    name: vidyamitra-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: EXCHANGE_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /
    autoDeploy: true

  # Frontend Service
  - type: web
    name: vidyamitra-frontend
    env: static
    plan: free
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: web/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://vidyamitra-backend.onrender.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    autoDeploy: true
